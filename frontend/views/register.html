<div class="auth-card card shadow">
    <div class="card-body p-4">
        <h3 class="text-center mb-4">Create account</h3>

        <div class="mb-3">
            <label for="reg-name" class="form-label">Full name</label>
            <input type="text" class="form-control" id="reg-name" placeholder="John Smith">
        </div>

        <div class="mb-3">
            <label for="reg-email" class="form-label">Email</label>
            <input type="email" class="form-control" id="reg-email" placeholder="you@example.com">
        </div>

        <div class="mb-3">
            <label for="reg-password" class="form-label">Password</label>
            <input type="password" class="form-control" id="reg-password" placeholder="Password">
        </div>

        <div class="mb-3">
            <label for="reg-confirm" class="form-label">Confirm password</label>
            <input type="password" class="form-control" id="reg-confirm" placeholder="Repeat password">
        </div>

        <a href="#login" class="btn btn-accent w-100">Register</a>

        <p class="text-center mt-3 mb-0">
            Already have an account? <a href="#login">Login</a>
        </p>
    </div>
</div>
