<h2 class="mb-1">Profile</h2>
<p class="text-muted mb-4">Manage your account and membership.</p>

<div class="row g-4">

    
    <div class="col-12 col-lg-7">
        <div class="card h-100">
            <div class="card-header fw-semibold">Personal information</div>
            <div class="card-body">
                <div class="mb-3">
                    <label for="p-name" class="form-label">Full name</label>
                    <input type="text" class="form-control" id="p-name" placeholder="Emma Brown">
                </div>
                <div class="mb-3">
                    <label for="p-email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="p-email" placeholder="emma@example.com">
                </div>
                <div class="mb-3">
                    <label for="p-password" class="form-label">New password</label>
                    <input type="password" class="form-control" id="p-password" placeholder="Leave empty to keep current">
                </div>
                <button class="btn btn-accent">Save changes</button>
            </div>
        </div>
    </div>

  
    <div class="col-12 col-lg-5">
        <div class="card h-100 plan-featured">
            <div class="card-header fw-semibold">My membership</div>
            <div class="card-body">
                <div class="plan-price">3 Months <span>plan</span></div>
                <p class="mb-1"><span class="text-muted">Started:</span> 01 Oct 2026</p>
                <p class="mb-1"><span class="text-muted">Expires:</span> 01 Jan 2027</p>
                <p class="mb-3"><span class="text-muted">Status:</span> <span class="badge text-bg-success">Active</span></p>
                <a href="#memberships" class="btn btn-outline-accent">Change plan</a>
            </div>
        </div>
    </div>

</div>
