<div class="d-flex flex-wrap justify-content-between align-items-center mb-4">
    <div>
        <h2 class="mb-1">Classes</h2>
        <p class="text-muted mb-0">Book a spot in our group classes.</p>
    </div>
    <button class="btn btn-accent mt-2 mt-md-0" data-bs-toggle="modal" data-bs-target="#addClassModal">
        <i class="bi bi-plus-lg"></i> Add class
    </button>
</div>


<div class="row g-2 mb-3">
    <div class="col-12 col-md-6">
        <input type="text" class="form-control" placeholder="Search classes...">
    </div>
    <div class="col-12 col-md-6">
        <select class="form-select">
            <option selected>All trainers</option>
            <option>Amina Hadzic</option>
            <option>Kenan Begic</option>
            <option>Lejla Softic</option>
            <option>Damir Mujic</option>
        </select>
    </div>
</div>


<div class="card">
    <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
            <thead>
                <tr>
                    <th>Class</th>
                    <th>Trainer</th>
                    <th>Date &amp; time</th>
                    <th class="text-center">Spots left</th>
                    <th class="text-end">Action</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Morning Yoga</td>
                    <td>Amina Hadzic</td>
                    <td>Mon, 08:00</td>
                    <td class="text-center"><span class="badge text-bg-success">5</span></td>
                    <td class="text-end"><button class="btn btn-accent btn-sm">Book</button></td>
                </tr>
                <tr>
                    <td>HIIT</td>
                    <td>Kenan Begic</td>
                    <td>Mon, 18:00</td>
                    <td class="text-center"><span class="badge text-bg-warning">2</span></td>
                    <td class="text-end"><button class="btn btn-accent btn-sm">Book</button></td>
                </tr>
                <tr>
                    <td>Strength Basics</td>
                    <td>Lejla Softic</td>
                    <td>Tue, 10:00</td>
                    <td class="text-center"><span class="badge text-bg-success">9</span></td>
                    <td class="text-end"><button class="btn btn-accent btn-sm">Book</button></td>
                </tr>
                <tr>
                    <td>Boxing</td>
                    <td>Damir Mujic</td>
                    <td>Wed, 19:00</td>
                    <td class="text-center"><span class="badge text-bg-danger">0</span></td>
                    <td class="text-end"><button class="btn btn-secondary btn-sm" disabled>Full</button></td>
                </tr>
            </tbody>
        </table>
    </div>
</div>


<div class="modal fade" id="addClassModal" tabindex="-1" aria-labelledby="addClassLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="addClassLabel">Add class</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label for="class-name" class="form-label">Class name</label>
                    <input type="text" class="form-control" id="class-name">
                </div>
                <div class="mb-3">
                    <label for="class-trainer" class="form-label">Trainer</label>
                    <select class="form-select" id="class-trainer">
                        <option>Amina Hadzic</option>
                        <option>Kenan Begic</option>
                        <option>Lejla Softic</option>
                        <option>Damir Mujic</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label for="class-time" class="form-label">Date &amp; time</label>
                    <input type="datetime-local" class="form-control" id="class-time">
                </div>
                <div class="mb-3">
                    <label for="class-capacity" class="form-label">Capacity</label>
                    <input type="number" class="form-control" id="class-capacity" min="1">
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-accent">Save</button>
            </div>
        </div>
    </div>
</div>
