<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GymHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="css/spapp.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <div class="d-flex">

        <nav class="sidebar" id="main-nav">
            <div class="sidebar-brand">
                <i class="fa-solid fa-dumbbell"></i> GymHub
            </div>

            <ul class="nav flex-column">
                <li class="nav-item">
                    <a class="nav-link" href="#dashboard"><i class="bi bi-house"></i> Dashboard</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#memberships"><i class="bi bi-ticket-perforated"></i> Memberships</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#trainers"><i class="bi bi-person-vcard"></i> Trainers</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#classes"><i class="bi bi-calendar-event"></i> Classes</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#bookings"><i class="bi bi-bookmark-check"></i> My Bookings</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#exercises"><i class="bi bi-person-arms-up"></i> Exercises</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#profile"><i class="bi bi-person-circle"></i> Profile</a>
                </li>
            </ul>

            <div class="sidebar-heading">Admin</div>
            <ul class="nav flex-column">
                <li class="nav-item">
                    <a class="nav-link" href="#users"><i class="bi bi-people"></i> Users</a>
                </li>
            </ul>

            <ul class="nav flex-column sidebar-bottom">
                <li class="nav-item">
                    <a class="nav-link" href="#login"><i class="bi bi-box-arrow-in-right"></i> Login</a>
                </li>
            </ul>
        </nav>

        <div class="content">
            <header class="topbar">
                <h5 id="page-title">Dashboard</h5>
            </header>

            <main id="spapp">
                <section id="login" data-load="login.html"></section>
                <section id="register" data-load="register.html"></section>
                <section id="memberships" data-load="memberships.html"></section>
                <section id="trainers" data-load="trainers.html"></section>
                <section id="classes" data-load="classes.html"></section>
                <section id="bookings" data-load="bookings.html"></section>
                <section id="exercises" data-load="exercises.html"></section>
                <section id="users" data-load="users.html"></section>
                <section id="profile" data-load="profile.html"></section>
                <section id="error_404" data-load="404.html"></section>
                <section id="dashboard" data-load="dashboard.html"></section>
            </main>
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/lib/jquery.spapp.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
